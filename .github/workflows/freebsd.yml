name: FreeBSD

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    name: build and test in a virtual machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # every other workflow measures Linux, and the port this module is
    # packaged in is a FreeBSD one

    steps:
      - uses: actions/checkout@v7

      - name: Build and drive the module in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: '14'
          prepare: |
            # curl is not in base; the build needs pcre2.  The bundled
            # Test::Nginx suite is Linux-only (it reads /proc/net/tcp and its
            # mock upstream binds a fixed port without SO_REUSEADDR), so
            # FreeBSD runs the end-to-end driver instead, which needs neither.
            pkg install -y git pcre2 curl
          run: |
            . .github/versions.env
            ci/build.sh "$NGINX_VERSION" "$HOME/nginx"
            # the driver sends real multipart and resumable uploads through
            # the base system's curl and reads the dates through its OpenSSL,
            # not the versions the Linux jobs use
            ci/upload.sh "$HOME/nginx/sbin/nginx"
            # www/nginx ships this module as a loadable object, so that is
            # the build the package is made of and it is built here too
            ci/build.sh "$NGINX_VERSION" "$HOME/nginx-dyn" dynamic
            UPLOAD_LOAD_MODULE=$HOME/nginx-dyn/modules/ngx_http_upload_module.so \
              ci/upload.sh "$HOME/nginx-dyn/sbin/nginx"
