# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file
#
# The probe uploads a small file through the module on every reload: a
# reload that detached the content handler would keep answering on the
# port but stop storing, so the probe checks what the module did, not that
# the server is up.

# upload_store with one level of hashing wants the digit directories there,
# and the small file the probe sends.
i=0
while [ "$i" -lt 10 ]; do
	mkdir -p "$WORK/store/$i"
	i=$((i + 1))
done
[ -f "$WORK/probe.txt" ] || printf 'reloaded' > "$WORK/probe.txt"

RELOAD_HTTP="
    client_body_temp_path $WORK/tmp;

    upstream reload_upstream { server 127.0.0.1:$((PORT + 1)); }

    server {
        listen 127.0.0.1:$((PORT + 1));
        location / { return 200 \"stored\"; }
    }"

RELOAD_SERVER="
        location = /upload/ {
            upload_pass @up;
            upload_store $WORK/store 1;
            upload_set_form_field name \$upload_file_name;
        }
        location @up { proxy_pass http://reload_upstream; }"

RELOAD_EXPECT='stored'

reload_probe() {
	curl -s --max-time 5 -F "file=@$WORK/probe.txt;filename=p.txt" \
		"http://127.0.0.1:$PORT/upload/"
}
